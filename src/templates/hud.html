<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StreetDyno">
    <meta name="theme-color" content="#000000">
    <meta name="format-detection" content="telephone=no">
    <title>StreetDyno 2.0 - Live HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --sat: env(safe-area-inset-top, 20px);
            --sab: env(safe-area-inset-bottom, 20px);
            --sal: env(safe-area-inset-left, 12px);
            --sar: env(safe-area-inset-right, 12px);
        }
        html, body {
            background: #000000;
            color: #ffffff;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(12px, var(--sat)) max(14px, var(--sar)) max(12px, var(--sab)) max(14px, var(--sal));
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 30px;
            background: #141418;
            border: 1px solid #2a2a32;
        }
        .rec-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00e676;
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
            transition: all 0.2s;
        }
        .rec-dot.active {
            background: #ff1744;
            box-shadow: 0 0 16px #ff1744;
            animation: pulse-dot 0.6s infinite alternate;
        }
        @keyframes pulse-dot { from { opacity: 0.3; } to { opacity: 1; } }
        .heartbeat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ffcc;
            opacity: 0.25;
            transition: opacity 0.1s;
        }
        .heartbeat-dot.beat { opacity: 1; box-shadow: 0 0 8px #00ffcc; }
        .top-actions { display: flex; gap: 8px; }
        .btn-icon {
            background: #1c1c22;
            border: 1px solid #33333e;
            color: #fff;
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-icon:active { background: #333; transform: scale(0.96); }
        .rev-bar-container {
            width: 100%;
            height: 16px;
            background: #111116;
            border-radius: 8px;
            border: 1px solid #22222a;
            overflow: hidden;
            margin-bottom: 10px;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
        }
        .rev-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e676 0%, #ffea00 60%, #ff9100 80%, #ff1744 100%);
            transition: width 0.08s linear;
        }
        .shift-light {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: max(8px, var(--sat));
            background: transparent;
            z-index: 9999;
            pointer-events: none;
        }
        .shift-light.flash {
            background: #ff1744;
            box-shadow: 0 0 40px 15px #ff1744;
            animation: flash-border 0.1s infinite;
        }
        @keyframes flash-border { 50% { opacity: 0.15; } }
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex-grow: 1;
            margin-bottom: 10px;
        }
        @media (orientation: landscape) {
            .hud-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
        }
        .hud-card {
            background: linear-gradient(165deg, #131318 0%, #0a0a0d 100%);
            border: 2px solid rgba(255, 255, 255, 0.07);
            border-radius: 22px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }
        .hud-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #71717a;
        }
        .hud-card .card-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(3.2rem, 9.5vw, 4.8rem);
            font-weight: 800;
            line-height: 0.95;
            margin: 6px 0;
            letter-spacing: -0.05em;
        }
        .hud-card .card-unit {
            font-size: 0.8rem;
            font-weight: 800;
            color: #52525b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .card-speed .card-value { color: #00ffcc; text-shadow: 0 0 35px rgba(0,255,204,0.35); }
        .card-rpm .card-value { color: #ff9800; text-shadow: 0 0 35px rgba(255,152,0,0.35); }
        .card-afr .card-value { color: #00e676; text-shadow: 0 0 35px rgba(0,230,118,0.35); }
        .card-egt .card-value { color: #ffd600; text-shadow: 0 0 35px rgba(255,214,0,0.35); }
        @keyframes danger-blink {
            0% { background: #131318; border-color: #ff1744; }
            50% { background: #3b0811; border-color: #ff1744; box-shadow: 0 0 40px rgba(255,23,68,0.8); }
            100% { background: #131318; border-color: #ff1744; }
        }
        .card-danger { animation: danger-blink 0.35s infinite !important; }
        .card-danger .card-value { color: #ff1744 !important; text-shadow: 0 0 35px #ff1744 !important; }
        .bottom-bar { display: flex; gap: 10px; min-height: 56px; }
        .btn-rec {
            flex: 2.2;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #18181f;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            box-shadow: 0 4px 20px rgba(0,255,204,0.2);
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-rec.recording {
            background: #ff1744;
            color: #ffffff;
            border: 2px solid #ff5252;
            box-shadow: 0 0 30px rgba(255,23,68,0.7);
            animation: pulse-btn 1s infinite alternate;
        }
        @keyframes pulse-btn { from { transform: scale(1); } to { transform: scale(0.98); } }
        .btn-rec:active { transform: scale(0.96); }
        .btn-nav {
            flex: 1;
            padding: 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 800;
            background: #18181f;
            color: #ffffff;
            border: 2px solid #2a2a34;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-nav:active { background: #272730; transform: scale(0.96); }
        .btn-sound {
            border-color: #ff9800;
            color: #ff9800;
            background: #181510;
        }
        .btn-sound:active { background: #2e1d08; }

        /* --- Audio Test Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #131318;
            border: 2px solid #2a2a38;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            text-align: center;
        }
        .modal-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.04em;
        }
        .modal-subtitle {
            font-size: 0.85rem;
            color: #71717a;
            margin-bottom: 20px;
        }
        .test-sound-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn-test-tone {
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 800;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-test-tone:active { transform: scale(0.97); }
        .tone-start {
            background: #0d2218;
            border-color: #00e676;
            color: #00e676;
        }
        .tone-stop {
            background: #082126;
            border-color: #00ffcc;
            color: #00ffcc;
        }
        .tone-alarm {
            background: #2b080f;
            border-color: #ff1744;
            color: #ff1744;
        }
        .tone-shift {
            background: #261b07;
            border-color: #ff9800;
            color: #ff9800;
        }
        .modal-close-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            background: #22222c;
            color: #ffffff;
            border: 1px solid #3a3a4c;
            cursor: pointer;
        }
        .modal-close-btn:active { background: #2f2f3d; }
    </style>
</head>
<body>
    <div id="shiftLight" class="shift-light"></div>
    <div class="top-bar">
        <div class="status-pill">
            <div id="recDot" class="rec-dot"></div>
            <span id="statusText">V5.1 READY</span>
            <div id="heartbeat" class="heartbeat-dot"></div>
        </div>
        <div id="gpsPill" class="status-pill">
            <span>🛰️ GPS:</span>
            <span id="gpsText" style="color:#00ffcc;">SUCHE...</span>
        </div>
        <div class="top-actions">
            <button class="btn-icon btn-sound" onclick="openSoundModal()">🔊 SOUND</button>
            <button class="btn-icon" onclick="toggleFullScreen()">⛶ HUD</button>
        </div>
    </div>
    <div class="rev-bar-container">
        <div id="revBar" class="rev-bar-fill"></div>
    </div>
    <div class="hud-grid">
        <div class="hud-card card-speed">
            <div class="card-header"><span>Speed</span><span>GPS</span></div>
            <div id="speed" class="card-value">0.0</div>
            <div class="card-unit">KM / H</div>
        </div>
        <div class="hud-card card-rpm" id="cardRpm">
            <div class="card-header"><span>Drehzahl</span><span id="gearBadge">RPM</span></div>
            <div id="rpm" class="card-value">0</div>
            <div class="card-unit">U / MIN</div>
        </div>
        <div class="hud-card card-afr" id="cardAfr">
            <div class="card-header"><span>Lambda</span><span id="afrZone">--</span></div>
            <div id="afr" class="card-value">0.0</div>
            <div class="card-unit">AFR (12.8 OPT)</div>
        </div>
        <div class="hud-card card-egt" id="cardEgt">
            <div class="card-header"><span>Abgastemp</span><span>MAX 630°C</span></div>
            <div id="egt" class="card-value">0</div>
            <div class="card-unit">°C (EGT)</div>
        </div>
    </div>
    <div class="bottom-bar">
        <button id="recBtn" class="btn-rec" onclick="toggleLogging()">🔴 PULL LOGGING STARTEN</button>
        <a href="/logs" class="btn-nav">📂 LOGS</a>
        <a href="/tuning" class="btn-nav">🔧 VERGASER</a>
    </div>

    <!-- Interactive Sound Test Modal -->
    <div id="soundModal" class="modal-overlay" onclick="closeSoundModalOnOutsideClick(event)">
        <div class="modal-box">
            <div class="modal-title">🔊 Audio- & Alarmton-Test</div>
            <div class="modal-subtitle">Web Audio Synthesizer & Haptik prüfen</div>
            <div class="test-sound-grid">
                <button class="btn-test-tone tone-start" onclick="testSound('start')">
                    <span>🔔 Pull-Start Signal</span>
                    <span>880 Hz</span>
                </button>
                <button class="btn-test-tone tone-stop" onclick="testSound('stop')">
                    <span>🏁 Pull-Erfolgs Chime</span>
                    <span>880→1174 Hz</span>
                </button>
                <button class="btn-test-tone tone-alarm" onclick="testSound('alarm')">
                    <span>🚨 Magerlauf / EGT Alarm</span>
                    <span>980 / 750 Hz</span>
                </button>
                <button class="btn-test-tone tone-shift" onclick="testSound('shift')">
                    <span>⚡ Shift-Light Blitz</span>
                    <span>1300 Hz</span>
                </button>
            </div>
            <button class="modal-close-btn" onclick="closeSoundModal()">✕ Schließen</button>
        </div>
    </div>

    <script>
        let wakeLock = null;
        function initWakeLock() {
            try {
                if ('wakeLock' in navigator && navigator.wakeLock.request) {
                    navigator.wakeLock.request('screen').then(lock => { wakeLock = lock; }).catch(() => {});
                }
            } catch (err) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') initWakeLock();
        });
        window.addEventListener('touchstart', initWakeLock, { passive: true, once: true });
        window.addEventListener('click', initWakeLock, { once: true });
        initWakeLock();

        // --- Web Audio Synthesizer & Haptics ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        window.addEventListener('touchstart', () => { getAudioContext(); }, { passive: true, once: true });
        window.addEventListener('click', () => { getAudioContext(); }, { once: true });

        function playTone(freq, type, durationMs, offsetSec = 0) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + offsetSec);

                gain.gain.setValueAtTime(0.001, ctx.currentTime + offsetSec);
                gain.gain.exponentialRampToValueAtTime(0.6, ctx.currentTime + offsetSec + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offsetSec + (durationMs / 1000));

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(ctx.currentTime + offsetSec);
                osc.stop(ctx.currentTime + offsetSec + (durationMs / 1000) + 0.05);
            } catch (e) {
                console.warn('Audio feedback error:', e);
            }
        }

        function notifyPullStart() {
            // High single beep: 880 Hz (A5)
            playTone(880, 'triangle', 130);
            if ('vibrate' in navigator) {
                try { navigator.vibrate(100); } catch(e){}
            }
        }

        function notifyPullStop() {
            // Ascending dual chime: 880 Hz -> 1174 Hz (A5 -> D6)
            playTone(880, 'sine', 80, 0.0);
            playTone(1174, 'triangle', 180, 0.10);
            if ('vibrate' in navigator) {
                try { navigator.vibrate([80, 50, 80]); } catch(e){}
            }
        }

        function notifyDangerAlarm() {
            // Pulsating Siren: 980 Hz -> 750 Hz -> 980 Hz
            playTone(980, 'sawtooth', 90, 0.0);
            playTone(750, 'sawtooth', 90, 0.11);
            playTone(980, 'sawtooth', 120, 0.22);
            if ('vibrate' in navigator) {
                try { navigator.vibrate([150, 80, 150]); } catch(e){}
            }
        }

        function notifyShiftLight() {
            // High-Pitch Shift Beep: 1300 Hz
            playTone(1300, 'square', 100);
            const sl = document.getElementById('shiftLight');
            if (sl) {
                sl.classList.add('flash');
                setTimeout(() => sl.classList.remove('flash'), 250);
            }
            if ('vibrate' in navigator) {
                try { navigator.vibrate([60]); } catch(e){}
            }
        }

        function openSoundModal() {
            getAudioContext();
            const m = document.getElementById('soundModal');
            if (m) m.classList.add('open');
        }

        function closeSoundModal() {
            const m = document.getElementById('soundModal');
            if (m) m.classList.remove('open');
        }

        function closeSoundModalOnOutsideClick(e) {
            if (e.target.id === 'soundModal') closeSoundModal();
        }

        function testSound(type) {
            getAudioContext();
            if (type === 'start') notifyPullStart();
            else if (type === 'stop') notifyPullStop();
            else if (type === 'alarm') notifyDangerAlarm();
            else if (type === 'shift') notifyShiftLight();
        }

        function toggleFullScreen() {
            try {
                const doc = document.documentElement;
                if (doc.requestFullscreen) {
                    if (!document.fullscreenElement) doc.requestFullscreen().catch(() => {});
                    else document.exitFullscreen().catch(() => {});
                } else if (doc.webkitRequestFullscreen) {
                    if (!document.webkitFullscreenElement) doc.webkitRequestFullscreen();
                    else doc.webkitExitFullscreen();
                }
            } catch (e) {}
        }

        function toggleLogging() {
            fetch('/api/toggle_logging?t=' + Date.now(), { cache: 'no-store' })
                .then(r => r.json())
                .then(d => updateRecState(d.is_logging))
                .catch(e => console.error(e));
        }

        function updateRecState(isLogging) {
            const btn = document.getElementById('recBtn');
            const dot = document.getElementById('recDot');
            if (!btn || !dot) return;
            if (isLogging) {
                btn.classList.add('recording');
                btn.innerText = '⏹️ LOGGING STOPPEN';
                dot.classList.add('active');
            } else {
                btn.classList.remove('recording');
                btn.innerText = '🔴 PULL LOGGING STARTEN';
                dot.classList.remove('active');
            }
        }

        let beatState = false;
        let prevIsLogging = false;
        let lastDangerAlarmTime = 0;

        // --- Automotive Cockpit Display Damping (PT1 / Lerp) ---
        // Industry Standard (Bosch/MoTeC): tau_rpm ≈ 180-220ms, tau_afr ≈ 300-400ms
        let targetRpm = 0.0;
        let targetSpeed = 0.0;
        let targetAfr = 0.0;
        let targetEgt = 0.0;

        let displayRpm = 0.0;
        let displaySpeed = 0.0;
        let displayAfr = 0.0;
        let displayEgt = 0.0;

        const speedEl = document.getElementById('speed');
        const rpmEl = document.getElementById('rpm');
        const afrEl = document.getElementById('afr');
        const egtEl = document.getElementById('egt');
        const revBar = document.getElementById('revBar');
        const shiftLight = document.getElementById('shiftLight');

        function renderDampedCockpit() {
            // 1. Damped RPM gliding (PT1 Filter) + 10 RPM Quantization for calm digits
            if (targetRpm <= 10.0) {
                displayRpm = 0.0;
            } else {
                displayRpm += (targetRpm - displayRpm) * 0.20;
            }

            // 2. Damped AFR gliding (filters single-stroke combustion flutter)
            if (displayAfr === 0.0) {
                displayAfr = targetAfr;
            } else if (targetAfr > 0.0) {
                displayAfr += (targetAfr - displayAfr) * 0.14;
            }

            // 3. Smooth Speed & EGT
            displaySpeed += (targetSpeed - displaySpeed) * 0.25;
            displayEgt += (targetEgt - displayEgt) * 0.18;

            // --- Render Numbers ---
            if (rpmEl) {
                // Automotive Digital Standard: Round to 10 RPM increments to prevent digit flutter
                const calmRpm = Math.round(displayRpm / 10) * 10;
                rpmEl.innerText = calmRpm.toLocaleString('de-DE');
            }
            if (afrEl && displayAfr > 0) {
                afrEl.innerText = displayAfr.toFixed(1);
            }
            if (speedEl) {
                speedEl.innerText = displaySpeed.toFixed(1);
            }
            if (egtEl) {
                egtEl.innerText = (displayEgt > 0) ? Math.round(displayEgt) : '0';
            }

            // Graphical Rev-Bar: continuous floating sweep for silky 60fps animation
            if (revBar) {
                const revPct = Math.min(100, Math.max(0, (displayRpm / 9000) * 100));
                revBar.style.width = revPct.toFixed(1) + '%';
            }

            if (shiftLight) {
                if (displayRpm >= 8000) shiftLight.classList.add('flash');
                else shiftLight.classList.remove('flash');
            }

            requestAnimationFrame(renderDampedCockpit);
        }
        requestAnimationFrame(renderDampedCockpit);

        // --- 10Hz Telemetry Polling Loop ---
        setInterval(() => {
            fetch('/api/data?t=' + Date.now(), { cache: 'no-store' })
                .then(r => r.json())
                .then(d => {
                    if (!d) return;
                    const hb = document.getElementById('heartbeat');
                    if (hb) {
                        beatState = !beatState;
                        if (beatState) hb.classList.add('beat');
                        else hb.classList.remove('beat');
                    }

                    // Feed raw targets into 60fps damping engine
                    targetRpm = (typeof d.rpm === 'number') ? d.rpm : 0.0;
                    targetSpeed = (typeof d.speed === 'number') ? d.speed : 0.0;
                    targetAfr = (typeof d.afr === 'number') ? d.afr : 0.0;
                    targetEgt = (typeof d.egt === 'number') ? d.egt : 0.0;

                    let isDanger = false;
                    const cardAfr = document.getElementById('cardAfr');
                    const afrZone = document.getElementById('afrZone');
                    if (cardAfr && afrZone) {
                        const effAfr = (displayAfr > 0) ? displayAfr : targetAfr;
                        if (effAfr > 13.5 && targetSpeed > 8.0) {
                            cardAfr.classList.add('card-danger');
                            afrZone.innerText = (effAfr >= 13.8) ? '🚨 KRITISCH!' : '⚠️ MAGER!';
                            cardAfr.style.borderColor = '#ff3366';
                            isDanger = true;
                        } else {
                            cardAfr.classList.remove('card-danger');
                            if (effAfr >= 11.6 && effAfr <= 12.8) {
                                afrZone.innerText = '🟢 OPTIMAL';
                                cardAfr.style.borderColor = '#00e676';
                            } else if (effAfr < 11.6 && effAfr >= 9.0) {
                                afrZone.innerText = '🔵 FETT';
                                cardAfr.style.borderColor = '#29b6f6';
                            } else if (effAfr > 12.8 && effAfr <= 13.5) {
                                afrZone.innerText = '⚠️ LEICHT MAGER';
                                cardAfr.style.borderColor = '#ffea00';
                            } else {
                                afrZone.innerText = '--';
                                cardAfr.style.borderColor = 'rgba(255, 255, 255, 0.07)';
                            }
                        }
                    }

                    const cardEgt = document.getElementById('cardEgt');
                    if (cardEgt) {
                        if (targetEgt >= 630.0) {
                            cardEgt.classList.add('card-danger');
                            isDanger = true;
                        } else {
                            cardEgt.classList.remove('card-danger');
                        }
                    }

                    // Audible danger alarm under load (max once every 1.8s)
                    const now = Date.now();
                    if (isDanger && (now - lastDangerAlarmTime > 1800)) {
                        lastDangerAlarmTime = now;
                        notifyDangerAlarm();
                    }

                    const gpsText = document.getElementById('gpsText');
                    if (gpsText) {
                        gpsText.innerText = d.fix ? '3D FIX' : 'SUCHE...';
                        gpsText.style.color = d.fix ? '#00e676' : '#ffea00';
                    }

                    const statusText = document.getElementById('statusText');
                    const statusStr = (typeof d.status === 'string') ? d.status : 'IDLE';
                    if (statusText) statusText.innerText = statusStr;

                    const isLogging = (statusStr.indexOf('REC') !== -1) || (d.is_logging === true);
                    updateRecState(isLogging);

                    // Audio & Haptic triggers on state transition
                    if (!prevIsLogging && isLogging) {
                        notifyPullStart();
                    } else if (prevIsLogging && !isLogging) {
                        notifyPullStop();
                    }
                    prevIsLogging = isLogging;
                })
                .catch(err => console.error('Fetch error:', err));
        }, 150);
    </script>
</body>
</html>
